<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f5f9;
            color: #222;
        }
        
        header {
            background: #243b55;
            color: white;
            padding: 22px;
            text-align: center;
        }
        
        .container {
            max-width: 850px;
            margin: 35px auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 15px #00000012;
        }
        
        input,
        textarea,
        button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 15px;
        }
        
        button {
            background: #243b55;
            color: white;
            border: none;
            cursor: pointer;
        }
        
        button:hover {
            background: #385b7d;
        }
        
        .task {
            background: #eef2f7;
            padding: 15px;
            margin-top: 12px;
            border-radius: 7px;
        }
        
        .task button {
            width: auto;
            margin-right: 8px;
        }
        
        .delete {
            background: #c0392b;
        }
        
        .edit {
            background: #2874a6;
        }
        
        #message {
            margin-top: 12px;
            color: #176b39;
        }
    </style>
</head>

<body>

    <header>
        <h1>Task Management System</h1>
        <p>Organize your work and manage your tasks</p>
    </header>

    <div class="container">

        <h2 id="formHeading">Create New Task</h2>

        <input type="text" id="title" placeholder="Enter task title">

        <textarea id="description" placeholder="Enter task description"></textarea>

        <button id="submitButton" onclick="saveTask()">
            Add Task
        </button>

        <button id="cancelButton" onclick="cancelEdit()" style="display:none; background:#777;">
            Cancel Edit
        </button>

        <p id="message"></p>

        <h2>My Tasks</h2>

        <div id="taskList">Loading tasks...</div>

    </div>

    <script>
        const API = "http://127.0.0.1:5000/todos";

        let editingTaskId = null;

        // LOAD ALL TASKS
        async function loadTasks() {
            try {
                const response = await fetch(API);

                if (!response.ok) {
                    throw new Error("Could not load tasks");
                }

                const data = await response.json();

                const tasks = Array.isArray(data) ?
                    data :
                    data.tasks;

                if (!Array.isArray(tasks)) {
                    throw new Error("Invalid tasks response");
                }

                const list = document.getElementById("taskList");
                list.innerHTML = "";

                if (tasks.length === 0) {
                    list.innerHTML = "<p>No tasks available.</p>";
                    return;
                }

                tasks.forEach(task => {
                    const item = document.createElement("div");
                    item.className = "task";

                    const heading = document.createElement("h3");
                    heading.textContent = task.title;

                    const description = document.createElement("p");
                    description.textContent = task.description || "";

                    // EDIT BUTTON
                    const editButton = document.createElement("button");
                    editButton.className = "edit";
                    editButton.textContent = "Edit";
                    editButton.onclick = () => editTask(task);

                    // DELETE BUTTON
                    const deleteButton = document.createElement("button");
                    deleteButton.className = "delete";
                    deleteButton.textContent = "Delete";
                    deleteButton.onclick = () => deleteTask(task.id);

                    item.append(
                        heading,
                        description,
                        editButton,
                        deleteButton
                    );

                    list.appendChild(item);
                });

            } catch (error) {
                console.error("Load error:", error);

                document.getElementById("taskList").textContent =
                    "Unable to load tasks. Check your API connection.";
            }
        }

        // ADD OR UPDATE TASK
        async function saveTask() {
            const title =
                document.getElementById("title").value.trim();

            const description =
                document.getElementById("description").value.trim();

            const message =
                document.getElementById("message");

            if (!title) {
                message.textContent = "Please enter a task title.";
                return;
            }

            const isEditing = editingTaskId !== null;

            const url = isEditing ?
                `${API}/${editingTaskId}` :
                API;

            const method = isEditing ? "PUT" : "POST";

            try {
                const response = await fetch(url, {
                    method: method,
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        title: title,
                        description: description
                    })
                });

                if (!response.ok) {
                    throw new Error("Task could not be saved");
                }

                message.textContent = isEditing ?
                    "Task updated successfully!" :
                    "Task added successfully!";

                cancelEdit();
                await loadTasks();

            } catch (error) {
                console.error("Save error:", error);
                message.textContent =
                    "Could not save task. Check your API connection.";
            }
        }

        // LOAD TASK DETAILS INTO FORM
        function editTask(task) {
            editingTaskId = task.id;

            document.getElementById("title").value =
                task.title || "";

            document.getElementById("description").value =
                task.description || "";

            document.getElementById("formHeading").textContent =
                "Edit Task";

            document.getElementById("submitButton").textContent =
                "Update Task";

            document.getElementById("cancelButton").style.display =
                "block";

            document.getElementById("message").textContent =
                "Editing task: " + task.title;

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        }

        // CANCEL EDITING
        function cancelEdit() {
            editingTaskId = null;

            document.getElementById("title").value = "";
            document.getElementById("description").value = "";

            document.getElementById("formHeading").textContent =
                "Create New Task";

            document.getElementById("submitButton").textContent =
                "Add Task";

            document.getElementById("cancelButton").style.display =
                "none";
        }

        // DELETE TASK
        async function deleteTask(id) {
            if (!confirm("Are you sure you want to delete this task?")) {
                return;
            }

            try {
                const response = await fetch(`${API}/${id}`, {
                    method: "DELETE"
                });

                if (!response.ok) {
                    throw new Error("Delete failed");
                }

                if (editingTaskId === id) {
                    cancelEdit();
                }

                document.getElementById("message").textContent =
                    "Task deleted successfully!";

                await loadTasks();

            } catch (error) {
                console.error("Delete error:", error);
                alert("Could not delete task.");
            }
        }

        // LOAD TASKS WHEN PAGE OPENS
        loadTasks();
    </script>

</body>

</html>
