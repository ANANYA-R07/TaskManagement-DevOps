---
- name: Check Kubernetes connection
  command: kubectl cluster-info
  changed_when: false

- name: Apply persistent volume claim
  command: kubectl apply -f {{ pvc_file }}

- name: Apply Kubernetes deployment
  command: kubectl apply -f {{ deployment_file }}

- name: Apply Kubernetes service
  command: kubectl apply -f {{ service_file }}

- name: Wait for deployment rollout
  command: kubectl rollout status deployment/{{ app_name }} --timeout=120s
  changed_when: false

- name: Display Kubernetes pods
  command: kubectl get pods
  register: pod_status
  changed_when: false

- name: Show pod status
  debug:
    var: pod_status.stdout